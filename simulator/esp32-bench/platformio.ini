; Draws every simulator scenario on an ESP32 and measures the time per screen (env bench),
; shows them on the round display (env demo), or lets the simulator drive the display (env remote).
; Runs on a real ESP32 DevKitC (pio run -t upload -t monitor) or in the Espressif QEMU
; emulator without hardware (./run_qemu.sh). Same platform and optimization (-Os) as the firmware.

[env:bench]
platform = espressif32 @^6.11.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_flags =
    -Os
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -I ../src
    ${sysenv.BENCH_FLAGS}
build_unflags =
    -std=gnu++11
lib_deps =
    lovyan03/LovyanGFX @ 1.2.30
    symlink://../../lib/RoundDisplay
build_src_filter = +<main.cpp>

; Display demo: ESP32 and the round display only (USB power), every screen for 4 s and a colour test
; picture; prints the real drawing time per screen. pio run -e demo -t upload -t monitor
[env:demo]
extends = env:bench
build_src_filter = +<demo.cpp>
build_flags =
    ${env:bench.build_flags}
    -I ../../src/display

; Display driven by the simulator on the computer over USB (simulator/src/RemoteLink.h):
; pio run -e remote -t upload, then simulator/run.sh --display auto
[env:remote]
extends = env:demo
build_src_filter = +<remote.cpp>

; Heap experiment for the Bluetooth scale library (src/ble_leak.cpp): stack down/up, scan restarts,
; the library itself, without and with WiFi. Same NimBLE version and flags as the Orione build and the
; same partition table, so the firmware's settings and WiFi in NVS/LittleFS stay where they are.
[env:ble_leak]
platform = espressif32 @^6.11.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
board_build.partitions = ../../partitions_orione_4M.csv
build_flags =
    -Os
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=1
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
    git+https://github.com/rancilio-pid/AcaiaArduinoBLE#v4.0.2
build_src_filter = +<ble_leak.cpp>

; The same with the fixed library (lib/OrioneScaleBLE), only part C, 15 minutes
[env:ble_leak_fixed]
extends = env:ble_leak
build_flags = ${env:ble_leak.build_flags} -D ONLY_LIBRARY -D LIBRARY_MINUTES=15
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
    symlink://../../lib/OrioneScaleBLE
