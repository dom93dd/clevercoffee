; Desktop simulator for the round display UI in ../lib/RoundDisplay
;
; Needs SDL2 (macOS: brew install sdl2, Debian/Ubuntu: apt install libsdl2-dev).
; Build and start: ./run.sh   (or: pio run && .pio/build/sim/program)
; Tests:           pio test -e test
;                  pio test -e sanitize   (same tests with AddressSanitizer and UBSan, slower)

[platformio]
default_envs = sim

[env:sim]
platform = native
lib_deps =
    lovyan03/LovyanGFX @ 1.2.30
    symlink://../lib/RoundDisplay
    symlink://../lib/Orione
build_flags =
    -O2
    -Wall
    -Wno-unknown-warning-option
    -Wno-vla-cxx-extension
extra_scripts = pre:sim_flags.py
; Tests run in env:test, so they do not overwrite the simulator program
test_ignore = *

[env:test]
extends = env:sim
test_ignore =

; Memory errors and undefined behaviour (e.g. NaN or huge floats turned into pixel coordinates)
; stop the test with a report; flags are added in sim_flags.py
[env:sanitize]
extends = env:test
