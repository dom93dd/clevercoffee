<!--
  Web interface of the Orione build (CC_ORIONE): one file, no libraries, served gzipped (~10 KB).
  Talks to the firmware's existing API: /parameters (GET ?names=, POST form), /events (SSE new_temps),
  /timeseries, /toggleBackflush, /toggleTareScale, /restart, /wifireset, /factoryreset,
  /download/config, /upload/config, /version, and /shots (last five shots, Orione build). Requests go one after another (the ESP32 answers one
  at a time, src/webRequestGate.h); a 503 ("busy") is retried.
-->
<style>
/* "Barlow SC": the round display's font (Barlow Semi Condensed, SIL OFL), loaded by loadFonts() */
:root{--font:"Barlow SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--bg:#0b0b0c;--card:#161618;--line:#26262a;--text:#f2f2f4;--mute:#8e8e94;--faint:#56565c;
--heat:#ff9226;--ready:#34d399;--brew:#f0b45c;--cool:#7dbeff;--err:#ef4444;--r:18px;
/* iPhone home screen app: the page runs under the status bar and next to the notch (viewport-fit=cover) */
--st:env(safe-area-inset-top,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
--sb:env(safe-area-inset-bottom,0px)} /* fitScreen() may lower it in the home screen app */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--font)}
button,input,select{font-family:inherit}
/* a column at least as high as the screen; the tab bar sticks to its bottom (position: fixed is unreliable in iOS home screen apps) */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:0 calc(16px + var(--sr)) 0 calc(16px + var(--sl))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--st);background:rgba(11,11,12,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:8} /* nothing scrolls under the clock */
main{max-width:640px;width:100%;margin:0 auto;flex:1 0 auto;order:2;padding-bottom:16px}
header{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(18px + var(--st)) 0 6px;width:100%;order:0}
.brand{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand small{display:block;font-weight:500;letter-spacing:.08em;color:var(--mute);font-size:11px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
nav{position:sticky;bottom:0;order:3;margin:0 calc(-16px - var(--sl)) 0 calc(-16px - var(--sr));display:flex;justify-content:center;gap:4px;padding:6px 8px calc(4px + var(--sb));background:rgba(11,11,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;background:none;color:var(--mute);font-size:12px;font-weight:600;line-height:1;border-radius:12px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--text)}
nav button.on svg{color:var(--heat)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.hero{text-align:center;padding:22px 16px 18px}
.temp{font-size:72px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.temp small{font-size:28px;color:var(--mute);margin-left:4px}
.sub{color:var(--mute);margin-top:6px;font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:18px 4px 6px}
.bar b{display:block;height:100%;background:var(--heat);transform:scaleX(0);transform-origin:left;transition:transform .6s}
.barlbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.card h2+.row,.row:first-child{border-top:0}
.lbl{min-width:0}
.lbl div{font-weight:550}
.lbl p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);border:0;cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ready)}
.sw.on:after{transform:translateX(20px)}
.step{display:flex;align-items:center;flex:none;background:var(--bg);border-radius:12px}
.step button{width:44px;height:44px;border:0;background:none;color:var(--text);font-size:22px;cursor:pointer}
.step input{width:76px;text-align:center;border:0;background:none;color:var(--text);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;flex:none;background:var(--bg);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--line);color:var(--text)}
.row.stack{flex-direction:column;align-items:stretch;gap:10px}
.row.stack .seg{width:100%}
.row.stack .seg button{flex:1;padding:8px 4px}
select,.txt{flex:none;max-width:52%;background:var(--bg);color:var(--text);border:0;border-radius:12px;padding:10px 12px;font-size:16px;font-weight:600} /* 16 px: iOS does not zoom in */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--line);color:var(--text);text-decoration:none}
.btn.pri{background:var(--heat);color:#1a1006}
.btn.bad{background:none;color:var(--err);box-shadow:inset 0 0 0 1.5px var(--err)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
canvas{display:block;width:100%;height:180px;margin-top:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
details summary:after{content:"+";font-size:18px;line-height:1}
details[open] summary:after{content:"−"}
.note{background:rgba(255,146,38,.12);color:var(--heat);border-radius:12px;padding:12px;font-size:14px;margin:12px 0}
.alarm{border-radius:14px;padding:14px 16px;margin:12px 0;font-size:16px;font-weight:650}
.alarm p{margin:3px 0 0;font-size:14px;font-weight:450;opacity:.9}
.alarm.err{background:rgba(239,68,68,.16);color:#fca5a5}
.alarm.info{background:rgba(125,190,255,.14);color:#bfdcff}
.liveshot{margin:10px 0 6px;padding:14px 16px;border-radius:14px;background:var(--bg)}
.liveshot .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brew)}
.liveshot .nums{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px;font-variant-numeric:tabular-nums}
.liveshot .nums b{font-size:44px;font-weight:300;letter-spacing:-.01em}
.liveshot .nums span{font-size:28px;font-weight:300;color:#ece2d0}
.liveshot .bar{margin:10px 0 6px}
.liveshot .bar b{background:var(--brew)}
.liveshot .goal{font-size:13px;color:var(--mute)}
.scalest{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-top:12px}
.scalest i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.scalest.on i{background:var(--ready)}
.scalest .low{color:var(--heat)}
.shot .dev{margin-left:6px;font-size:13px;font-weight:600;color:var(--mute)}
.shot .dev.off{color:var(--heat)}
.liveshot .hint{color:var(--heat);margin-top:4px}
.scalenow{margin:14px 0 0;font-size:15px}
.scalenow.on{color:var(--ready)}
.foundscale{border-top:1px solid var(--line)}
.dialcard{display:flex;justify-content:center;padding:16px}
.dialcard canvas{width:min(100%,300px);height:auto;aspect-ratio:1;margin:0}
.recipe{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0 4px;border-top:1px solid var(--line)}
.recipe label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
.recipe .step{width:100%;justify-content:space-between}
.recipe .step input{width:100%;min-width:0}
.recipe .txt{max-width:none;width:100%;text-align:center}
.recipe .bean{grid-column:1/-1}
.recipe select{max-width:none;width:100%}
.beanrow{border-top:1px solid var(--line)}
.beanrow .lbl div{overflow-wrap:anywhere}
.beanrow .btns{margin:0;flex:none;gap:6px}
.beanrow .btn{padding:9px 12px;font-size:14px}
.beanrow .on{color:var(--ready);font-size:14px;font-weight:600;flex:none}
.shotinfo{font-size:13px;color:var(--mute);margin:10px 0 2px}
.shotinfo .cold,.shot .cold{color:var(--cool)}
.taste{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:14px;color:var(--mute)}
.taste .seg{flex:1}
.taste .seg button{flex:1}
.cmp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px;font-size:13px;color:var(--mute)}
.cmp button{border:0;border-radius:9px;background:var(--bg);color:var(--text);padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
.cmp button.on{box-shadow:inset 0 0 0 2px var(--heat)}
.ai{margin:12px 0 6px;padding:12px 14px;border-radius:14px;background:rgba(168,140,255,.11);color:#ddd2ff;font-size:15px;line-height:1.45}
.ai b{flex:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#b9a6ff}
.ai div{white-space:pre-wrap;margin-top:4px}
details.ai>summary{align-items:center;justify-content:flex-start;gap:8px;min-height:24px;font-size:inherit;font-weight:inherit;letter-spacing:normal;text-transform:none;color:inherit} /* not the folded cards' title style */
details.ai>summary::-webkit-details-marker{display:none}
details.ai>summary::after,details.ai[open]>summary::after{content:"";flex:none;margin-left:auto;width:7px;height:7px;border-right:2px solid #b9a6ff;border-bottom:2px solid #b9a6ff;transform:translateY(-2px) rotate(45deg);transition:transform .2s} /* points down: unfold */
details.ai[open]>summary::after{transform:translateY(2px) rotate(225deg)} /* points up: fold */
.ai .teaser{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;opacity:.8}
.ai[open] .teaser{display:none}
.ai .linkbtn{margin-top:8px;color:#b9a6ff}
.ai .apply{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(185,166,255,.22)}
.ai .apply p{flex:1;margin:0;font-size:14px}
.ai .apply span{display:block}
.ai .apply small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#b9a6ff}
.ai .apply .btn{flex:none;padding:9px 14px;font-size:14px;background:#b9a6ff;color:#1a1430}
.ai .apply .btn:disabled{background:none;color:#b9a6ff;box-shadow:inset 0 0 0 1.5px rgba(185,166,255,.5)}
.linkbtn{display:inline-block;background:none;border:0;color:var(--heat);font-weight:600;font-size:15px;padding:0;cursor:pointer;text-decoration:none}
.claude p{margin:6px 0 12px;color:var(--mute);font-size:14px}
.claude .txt{max-width:none;width:100%;margin:12px 0}
.claude p.err{color:#fca5a5;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--sb));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.reboot .toast{bottom:calc(134px + var(--sb))}
body.reboot main{padding-bottom:82px} /* room for the restart bar above the tabs */
.rebootbar{position:fixed;left:16px;right:16px;bottom:calc(70px + var(--sb));max-width:608px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.rebootbar .btn{padding:9px 12px;font-size:14px;flex:none}
.ver{color:var(--faint);font-size:12px;margin-top:14px}
.shot{display:grid;grid-template-columns:1fr 1fr auto 12px;gap:8px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;cursor:pointer}
.shot:first-child{border-top:0}
.shot i{font-style:normal;color:var(--faint);transition:transform .2s}
.shot.open i{transform:rotate(90deg)}
.curve{padding:0 0 12px}
.curve canvas{height:170px;margin-top:0}
.bars{height:120px;margin:6px 0 2px}
.shot small{color:var(--mute);font-size:13px}
.empty{color:var(--mute);margin:10px 0 4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.chips button{border:0;border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;font-weight:600;padding:10px 4px;cursor:pointer}
.chips small{display:block;margin-top:2px;color:var(--mute);font-size:12px;font-weight:500}
.chips button.on{box-shadow:inset 0 0 0 2px var(--heat)}
.chips button.on small{color:var(--heat)}
.pair{display:flex;flex-direction:column;gap:6px;flex:none}
[hidden]{display:none!important}
@media (min-width:720px){.rebootbar{bottom:16px}body.reboot .toast{bottom:84px}body{padding-bottom:24px}body.reboot{padding-bottom:90px}body.reboot main{padding-bottom:16px}nav{position:static;order:1;width:100%;max-width:640px;margin:8px auto 0;background:none;border:0;padding:0;backdrop-filter:none}nav button{flex-direction:row;gap:8px;font-size:14px;padding:10px 12px}.toast{bottom:24px}}
</style>
</head>

  if (def.shot) drawShotCharts(); // canvases have no size while their tab is hidden
}
addEventListener("hashchange", () => { tab = location.hash.slice(1); render(); });
addEventListener("resize", () => { drawChart(); drawShotCharts(); paintDial(); });
// The display's font, through the request chain like everything else (the browser would fetch
// @font-face files in parallel with the page's requests); from the browser cache after the first time
async function loadFonts() {
  if (!window.FontFace) return;
  for (const [file, weight] of [["barlow-sc-500.woff2", "100 550"], ["barlow-sc-600.woff2", "551 900"]]) {
    try {
      const r = await call("/fonts/" + file, {cache: "default"});
      if (r.ok) { const f = new FontFace("Barlow SC", r.buf, {weight}); await f.load(); document.fonts.add(f); }
    } catch (e) {} // the system font stays
  }
  drawChart(); drawShotCharts(); paintDial(); // canvases draw with it from now on
}
(async () => {
  fitScreen();
  try { await load(TABS[0].names); } catch (e) {}
  setLang();
  await render();
  await loadHistory();
  paintLive();
  connectLive();
  await loadFonts();
  for (const x of TABS) { try { await load(needOf(x)); } catch (e) {} } // the other tabs' values, one request after another
  await loadShots();
  loadBeans();
})();
</script>
</body>
</html>
