<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Orione</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ff9226' stroke-width='4'/%3E%3C/svg%3E">
<!--
  Web interface of the Orione build (CC_ORIONE): one file, no libraries, served gzipped (~10 KB).
  Talks to the firmware's existing API: /parameters (GET ?names=, POST form), /events (SSE new_temps),
  /timeseries, /toggleBackflush, /toggleTareScale, /restart, /wifireset, /factoryreset,
  /download/config, /upload/config, /version, and /shots (last five shots, Orione build). Requests go one after another (the ESP32 answers one
  at a time, src/webRequestGate.h); a 503 ("busy") is retried.
-->
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--bg:#0b0b0c;--card:#161618;--line:#26262a;--text:#f2f2f4;--mute:#8e8e94;--faint:#56565c;
--heat:#ff9226;--ready:#34d399;--brew:#f0b45c;--cool:#7dbeff;--err:#ef4444;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--font)}
button,input,select{font-family:inherit}
body{padding:0 16px calc(84px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
header{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand small{display:block;font-weight:500;letter-spacing:.08em;color:var(--mute);font-size:11px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(11,11,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;background:none;color:var(--mute);font-size:12px;font-weight:600;line-height:1;border-radius:12px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--text)}
nav button.on svg{color:var(--heat)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.hero{text-align:center;padding:22px 16px 18px}
.temp{font-size:72px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.temp small{font-size:28px;color:var(--mute);margin-left:4px}
.sub{color:var(--mute);margin-top:6px;font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:18px 4px 6px}
.bar b{display:block;height:100%;background:var(--heat);transform:scaleX(0);transform-origin:left;transition:transform .6s}
.barlbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.card h2+.row,.row:first-child{border-top:0}
.lbl{min-width:0}
.lbl div{font-weight:550}
.lbl p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);border:0;cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ready)}
.sw.on:after{transform:translateX(20px)}
.step{display:flex;align-items:center;flex:none;background:var(--bg);border-radius:12px}
.step button{width:40px;height:40px;border:0;background:none;color:var(--text);font-size:22px;cursor:pointer}
.step input{width:76px;text-align:center;border:0;background:none;color:var(--text);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;flex:none;background:var(--bg);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--line);color:var(--text)}
.row.stack{flex-direction:column;align-items:stretch;gap:10px}
.row.stack .seg{width:100%}
.row.stack .seg button{flex:1;padding:8px 4px}
select,.txt{flex:none;max-width:52%;background:var(--bg);color:var(--text);border:0;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--line);color:var(--text);text-decoration:none}
.btn.pri{background:var(--heat);color:#1a1006}
.btn.bad{background:none;color:var(--err);box-shadow:inset 0 0 0 1.5px var(--err)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
canvas{display:block;width:100%;height:180px;margin-top:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
details summary:after{content:"+";font-size:18px;line-height:1}
details[open] summary:after{content:"−"}
.note{background:rgba(255,146,38,.12);color:var(--heat);border-radius:12px;padding:12px;font-size:14px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.reboot .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.rebootbar{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.rebootbar .btn{padding:9px 12px;font-size:14px;flex:none}
.ver{color:var(--faint);font-size:12px;margin-top:14px}
.shot{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.shot:first-child{border-top:0}
.shot small{color:var(--mute);font-size:13px}
.empty{color:var(--mute);margin:10px 0 4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.chips button{border:0;border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;font-weight:600;padding:10px 4px;cursor:pointer}
.chips small{display:block;margin-top:2px;color:var(--mute);font-size:12px;font-weight:500}
.chips button.on{box-shadow:inset 0 0 0 2px var(--heat)}
.chips button.on small{color:var(--heat)}
.pair{display:flex;flex-direction:column;gap:6px;flex:none}
[hidden]{display:none!important}
@media (min-width:720px){.rebootbar{bottom:16px}body.reboot .toast{bottom:84px}body{padding-bottom:24px}nav{position:static;max-width:640px;margin:8px auto 0;background:none;border:0;padding:0;backdrop-filter:none}nav button{flex-direction:row;gap:8px;font-size:14px;padding:10px 12px}.toast{bottom:24px}}
</style>
</head>

let lang = "de";
const t = k => T[lang][k] ?? T.de[k] ?? k;
const OPTION_DE = {"Manual": "Manuell", "Automatic": "Automatisch", "Normally Open": "Schließer", "Normally Closed": "Öffner"};
const optLabel = l => lang === "de" ? (OPTION_DE[l] ?? l) : l;

// ---------- what the tabs show (ids of the firmware's parameters) ----------
const UNIT = {"brew.setpoint": "°C", "brew.temp_offset": "°C", "display.blinking.delta": "°C", "brew.by_time.target_time": "s",
  "brew.by_weight.target_weight": "g", "display.post_brew_timer_duration": "s", "standby.time": "min",
  "backflush.fill_time": "s", "backflush.flush_time": "s", "pid.regular.tn": "s", "pid.regular.tv": "s"};
const STEP = {"brew.setpoint": .5, "brew.temp_offset": .1, "display.blinking.delta": .1, "brew.by_time.target_time": .5,
  "brew.by_weight.target_weight": .5, "display.post_brew_timer_duration": .5, "standby.time": 5, "backflush.cycles": 1,

const TABS = [
  {id: "status", icon: "i-status", names: ["pid.enabled", "brew.setpoint", "BACKFLUSH_ON", "display.language", "display.blinking.delta"]},
  {id: "brew", icon: "i-brew", shot: true, cards: []},

const SHOWN_IF = {"standby.time": "standby.enabled", "hardware.sensors.watertank.mode": "hardware.sensors.watertank.enabled",

const SHOT = ["brew.mode", "brew.by_time.enabled", "brew.by_time.target_time", "brew.by_weight.enabled", "brew.by_weight.target_weight", "hardware.sensors.scale.enabled", "brew.presets", "TARE_ON"];
// settings the firmware only shows depending on another one (ParameterRegistry show conditions)
const DEPENDS = {"brew.mode": /^brew\.by_|^display\.blescale/, "hardware.sensors.scale.enabled": /^brew\.by_weight|^TARE_ON|^display\.blescale/};
function forget(id) { for (const k of Object.keys(P)) if (DEPENDS[id]?.test(k)) delete P[k]; }

// ---------- talking to the ESP32: one request at a time, retry while it is busy ----------
const P = {};          // parameters by id: {value, type, min, max, reboot, options}
let chain = Promise.resolve();
function call(url, opt = {}) {
  const run = async () => {
    for (let i = 0; ; i++) {
      try {
        const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 9000);
        const r = await fetch(url, {...opt, signal: ctl.signal, cache: "no-store"});
        // read the whole answer before the next request starts: the ESP32 is busy until it has sent it
        const body = r.type === "opaqueredirect" ? "" : await r.text();
        clearTimeout(timer);
        if (r.status !== 503 || i >= 4) return {ok: r.ok || r.type === "opaqueredirect", status: r.status, text: async () => body, json: async () => JSON.parse(body)};
      } catch (e) { if (i >= 2) throw e; }
      await new Promise(ok => setTimeout(ok, 600 + i * 700));
    }
  };
  const p = chain.then(run, run);
  chain = p.catch(() => {});
  return p;
}
async function load(names) {
  const want = names.filter(n => !(n in P));
  for (let i = 0; i < want.length; i += 8) {
    const part = want.slice(i, i + 8);
    const r = await call(`/parameters?offset=0&limit=8&names=${part.join(",")}`);
    if (!r.ok) throw new Error(r.status);
    for (const p of (await r.json()).parameters || []) P[p.name] = p;
    for (const n of part) if (!(n in P)) P[n] = null; // not in this build or hidden: the row is left out
  }
}
async function save(id, value) {
  if (id.startsWith("preset.")) return savePreset(id, value);

  let v = views[def.id];
  if (!v || dirty.has(def.id)) {
    try { await load(needOf(def)); } catch (e) { toast(t("failed")); }
    if (def !== (TABS.find(x => x.id === tab) || TABS[0])) return; // switched meanwhile
    const nv = el("div");
    build(def, nv);
    if (v) v.replaceWith(nv); else $("#main").append(nv);
    views[def.id] = v = nv;
    dirty.delete(def.id);
  }
  for (const [id, e] of Object.entries(views)) e.hidden = id !== def.id;
  shown = def.id;
  scrollTo(0, scrollAt[def.id] || 0);
  if (def.id === "status") paintLive();
}
addEventListener("hashchange", () => { tab = location.hash.slice(1); render(); });
addEventListener("resize", drawChart);
(async () => {
  try { await load(TABS[0].names); } catch (e) {}
  setLang();
  await render();
  await loadHistory();
  paintLive();
  connectLive();
  for (const x of TABS) { try { await load(needOf(x)); } catch (e) {} } // the other tabs' values, one request after another
  loadShots();
})();
</script>
</body>
