[platformio]
lib_dir = lib
src_dir = src
extra_configs = platformio_extra.ini

[env]
platform = espressif32 @^6.11.0
board = az-delivery-devkit-v4
board_build.filesystem = littlefs
board_build.partitions = partitions_4M.csv

build_flags =
  -Os
  -D CONFIG_MAX_FILENAME_LEN=64
  -D CONFIG_MAX_URL_LEN=128
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D DEFAULT_MAX_WS_CLIENTS=4
  -D CORE_DEBUG_LEVEL=0
  -D CONFIG_ARDUHAL_LOG_COLORS=0
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D ASYNC_TCP_SSL_ENABLED=0
  -std=gnu++17

build_unflags =
  -std=gnu++11

framework = arduino
monitor_speed = 115200
check_tool = clangtidy
check_skip_packages = yes
lib_deps =
    lebuni/ZACwire for TSic @ 2.0.0
    milesburton/DallasTemperature @ 4.0.4
    paulstoffregen/OneWire @ 2.3.8
    olkal/HX711_ADC @ 1.2.12
    olikraus/U8g2 @ 2.36.9
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.9
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    git+https://github.com/tzapu/WiFiManager @ 2.0.17
    h2zero/NimBLE-Arduino@^2.3.6
    git+https://github.com/rancilio-pid/AcaiaArduinoBLE#v4.0.1
lib_ignore = RoundDisplay ; round TFT UI, only in the esp32_round_* envs

extra_scripts =
    pre:auto_firmware_version.py
    pre:run_clangformat.py
    pre:auto_compression.py
    pre:bundle_frontend.py
    pre:precompile_html.py

[env:esp32_usb]
monitor_filters = esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:esp32_ota]
monitor_port = socket://silvia.local:23
upload_protocol = espota
upload_port = silvia.local
upload_flags = --auth=otapass

; Round 1.28" GC9A01 TFT instead of the OLED (UI in lib/RoundDisplay, simulator in simulator/)
[round_display]
; Web server task on core 0 (next to WiFi/BT) instead of core 1 as in [env]: on core 1, with
; priority 10, it interrupts loop() and the display animations for up to ~150 ms per page
; CC_ORIONE: the slim Orione firmware (Dominik's Quick Mill Orione 3000), see slim-firmware-analysis.md
; in the project folder: web request gate (src/webRequestGate.h), smaller SSE queue
build_flags =
    ${env.build_flags}
    -D ROUND_DISPLAY
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CC_ORIONE
    -D SSE_MAX_QUEUED_MESSAGES=8
    ; the scale is a BLE client: no server/advertising roles, one connection (NimBLE-Arduino 2.5.x names)
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=1
build_unflags =
    ${env.build_unflags}
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
; as [env], but NimBLE pinned (the -D names above are those of 2.5.x) and AcaiaArduinoBLE v4.0.2
; ("Stop scanning before clearing results to prevent race condition", 9afd589)
lib_deps =
    lebuni/ZACwire for TSic @ 2.0.0
    milesburton/DallasTemperature @ 4.0.4
    paulstoffregen/OneWire @ 2.3.8
    olkal/HX711_ADC @ 1.2.12
    olikraus/U8g2 @ 2.36.9
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.9
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    git+https://github.com/tzapu/WiFiManager @ 2.0.17
    h2zero/NimBLE-Arduino @ 2.5.1
    git+https://github.com/rancilio-pid/AcaiaArduinoBLE#v4.0.2
    lovyan03/LovyanGFX @ 1.2.30
lib_ignore =
extra_scripts =
    ${env.extra_scripts}
    pre:orione_frontend.py

[env:esp32_round_usb]
extends = env:esp32_usb
extra_scripts = ${round_display.extra_scripts}
build_flags = ${round_display.build_flags}
build_unflags = ${round_display.build_unflags}
lib_deps = ${round_display.lib_deps}
lib_ignore = ${round_display.lib_ignore}

[env:esp32_round_ota]
extends = env:esp32_ota
upload_port = orione.local
monitor_port = socket://orione.local:23
extra_scripts = ${round_display.extra_scripts}
build_flags = ${round_display.build_flags}
build_unflags = ${round_display.build_unflags}
lib_deps = ${round_display.lib_deps}
lib_ignore = ${round_display.lib_ignore}

; Measurement build: prints how long each part of loop() takes (src/display/roundTiming.h)
[env:esp32_round_timing]
extends = env:esp32_round_usb
build_flags = ${round_display.build_flags} -D ROUND_TIMING

; Bench build without the machine: simulated thermoblock instead of the TSIC (TempSensorFake.h).
; NEVER flash this into the machine: the heater would be switched on a made-up temperature.
[env:esp32_round_bench]
extends = env:esp32_round_timing
build_flags = ${round_display.build_flags} -D ROUND_TIMING -D CC_FAKE_TEMP_SENSOR -D CC_FAKE_SCALE

; Bench build with the real Bluetooth scale code (no fake scale): heap measurements with BLE scanning
[env:esp32_round_bench_ble]
extends = env:esp32_round_bench
build_flags = ${round_display.build_flags} -D ROUND_TIMING -D CC_FAKE_TEMP_SENSOR

; Bench build plus the WiFi setup portal on port 8080 in the home WiFi, to look at and test its
; pages from a computer (src/orioneWifiPortal.h; saving is intercepted and changes nothing)
[env:esp32_round_portal]
extends = env:esp32_round_bench
build_flags = ${round_display.build_flags} -D ROUND_TIMING -D CC_FAKE_TEMP_SENSOR -D CC_FAKE_SCALE -D ORIONE_PORTAL_PREVIEW

; Same measurement with the stock OLED firmware, as the baseline (heap, loop times)
[env:esp32_stock_timing]
extends = env:esp32_usb
build_flags = ${env.build_flags} -D ROUND_TIMING
